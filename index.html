<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holzverbindungen – interaktives Arbeitsblatt (Tafelbild-Stil)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--card:#fffdf9;--ink:#2a2118;--mut:#6b5d4d;--acc:#8e3f60;--blob:#a65577;--ban:#a9cb8b;--bi:#14240c;--btn:#4f7d3a;--ok:#2d8a4f;--bad:#c0392b;--hl:#f6e8c8;--bd:#e4d5ba}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a1d;--card:#292227;--ink:#f3e9e0;--mut:#c2b3a3;--acc:#f0a6c3;--blob:#7a3a58;--ban:#4f7d3a;--bi:#fff;--btn:#6f9a55;--ok:#5fd08a;--bad:#ff7a66;--hl:#3b2f26;--bd:#4d4038}}
:root[data-theme="dark"]{--bg:#1e1a1d;--card:#292227;--ink:#f3e9e0;--mut:#c2b3a3;--acc:#f0a6c3;--blob:#7a3a58;--ban:#4f7d3a;--bi:#fff;--btn:#6f9a55;--ok:#5fd08a;--bad:#ff7a66;--hl:#3b2f26;--bd:#4d4038}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:10px 14px 40px}
.sr{position:absolute;left:-9999px}
.hero svg{width:100%;height:auto;display:block;max-width:760px;margin:0 auto}
.hero text{font-family:"Amatic SC","Arial Narrow",Impact,system-ui,sans-serif;font-weight:700}
h2,h3{font-family:"Amatic SC","Arial Narrow",Impact,system-ui,sans-serif;font-weight:700;letter-spacing:.03em}
h2.ban{background:var(--ban);color:var(--bi);text-align:center;font-size:2.4rem;line-height:1.1;margin:10px 0 4px;padding:8px 14px;border-radius:14px 44px 16px 40px/34px 14px 38px 12px;box-shadow:inset 0 0 14px rgba(70,110,40,.35)}
h3{color:var(--acc);margin:.9em 0 .3em;font-size:1.9rem;line-height:1.1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;justify-content:center}
.tabs button{padding:6px 14px;border:2px solid var(--ban);background:var(--bg);color:var(--ink);border-radius:18px 24px 16px 26px;font:inherit;font-size:.92rem;cursor:pointer}
.tabs button.on{background:var(--ban);color:var(--bi);font-weight:bold}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px 34px 20px 30px;padding:6px 16px 16px}
.draw{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.draw .im{background:#fff;border-radius:10px;padding:4px;flex:1 1 280px;max-width:440px}.draw img{width:100%;display:block}
.draw .ls{flex:1 1 200px;display:grid;gap:10px}
.draw label b{display:inline-block;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;border:2px solid var(--blob);color:var(--acc);border-radius:50%;margin-right:8px;font-size:.9rem}
select,textarea{font:inherit;background:var(--bg);color:var(--ink);border:2px solid var(--bd);border-radius:8px;padding:4px 6px}
textarea{width:100%;min-height:56px;display:block;margin:4px 0}
#s2 p{line-height:2.4}
.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
button.a{margin:8px 8px 0 0;padding:8px 16px;border-radius:12px 18px 12px 18px;border:0;background:var(--btn);color:#fff;font:inherit;font-size:.95rem;cursor:pointer}
button.a.g{background:transparent;color:var(--acc);border:2px solid var(--blob)}
.res{font-weight:bold}
.fs{border-top:2px dotted var(--bd);padding:8px 0}.fs q{font-weight:bold}
.mu{background:var(--hl);border-left:5px solid var(--ban);border-radius:6px;padding:6px 10px;margin-top:4px;font-style:italic}
.zt{width:100%;border-collapse:collapse}.zt th,.zt td{border:1px solid var(--bd);padding:6px;vertical-align:top;text-align:left}.zt th{background:var(--hl)}
.zt textarea{min-height:48px}
.note{color:var(--mut);font-size:.9rem;text-align:center}
</style></head><body><main>
